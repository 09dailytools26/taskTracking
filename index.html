<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fff7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1a24" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:light;
  --bg:#fff7fa; --surface:#ffffff; --surface2:#f7eef6; --ink:#463b58; --ink2:#8c809e; --line:#f0e1ec;
  --accent:#8f6fd0; --onaccent:#ffffff; --accent-soft:#eee6fb;
  --pink:#f29bb7; --warn:#e0674f; --warn-bg:#fff0ea; --good:#4fae86;
  --hero1:#fde2ec; --hero2:#e9e1fb;
  --tagink:#3d3350;
  --shadow:0 2px 10px rgba(143,111,208,.08);
  --r:18px;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#1d1a24; --surface:#27232f; --surface2:#312c3b; --ink:#f3edf8; --ink2:#b5aac4; --line:#3b3547;
    --accent:#c3a8f0; --onaccent:#1d1a24; --accent-soft:#372e4a;
    --pink:#f5a9c1; --warn:#ff9a84; --warn-bg:#3d2724; --good:#7fd1ad;
    --hero1:#3a2a36; --hero2:#2e2842;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button,select,input,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:active{transform:scale(.98)}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
.top{padding-block:16px 4px;display:flex;flex-direction:column;gap:12px}
.dayline{display:flex;align-items:center;gap:10px}
.navbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:20px;line-height:1;display:grid;place-items:center;flex:none;color:var(--ink2)}
.date{flex:1;min-width:0}
.eyebrow{font-size:12px;color:var(--ink2);letter-spacing:.12em;font-weight:700}
.date h1{margin:0;font-size:clamp(23px,6.4vw,30px);font-weight:800;line-height:1.25}
.date .sub{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:0;background:var(--accent);color:var(--onaccent);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700}

/* hero countdown */
.hero{border:0;width:100%;text-align:left;border-radius:22px;padding:16px 18px;background:linear-gradient(120deg,var(--hero1),var(--hero2));display:flex;align-items:center;gap:14px;color:var(--ink)}
.hero .l{flex:1;min-width:0}
.hero .l b{display:block;font-size:15px;overflow-wrap:anywhere}
.hero .l span{font-size:13px;color:var(--ink2)}
.hero .cd{text-align:right;flex:none}
.hero .cd small{font-size:13px;font-weight:700;color:var(--ink2)}
.hero .cd strong{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero .cd em{font-style:normal;font-size:14px;font-weight:700;margin-left:2px}
.hero.now .cd strong{font-size:24px;color:var(--warn)}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.prog{display:flex;flex-direction:column;gap:8px}
.prog .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog .big{font-size:28px;font-weight:800;line-height:1}
.prog .big small{font-size:13px;font-weight:700;color:var(--ink2);margin-left:4px}
.prog .rest{font-size:13px;font-weight:700;color:var(--ink2)}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex;gap:2px}
.bar span{display:block;height:100%;border-radius:999px}

/* timer */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .t{flex:1;min-width:0}
.timer .t small{display:block;font-size:12px;color:var(--ink2);font-weight:700}
.timer .t b{font-size:22px;font-weight:800}
.timer.run{background:var(--accent-soft)}
.timer.run b{font-size:30px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:none;color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.btn.sm{padding:6px 14px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .grow{flex:1}

/* sections */
h2.sec{font-size:16px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink);flex:none}
h2.sec .cnt{font-size:13px;color:var(--ink2);font-weight:700;margin-left:auto}
.list{display:flex;flex-direction:column;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--cb);color:var(--tagink);border-radius:999px;padding:0 10px;font-size:12px;font-weight:700;line-height:1.9;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.task{display:flex;align-items:stretch;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:58px}
.task .main{flex:1;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border:0;background:none;text-align:left;min-width:0}
.check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--cd);flex:none;display:grid;place-items:center}
.task .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.task .line1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task .name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.task .memo{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.task .more{border:0;background:none;width:44px;flex:none;color:var(--ink2);font-size:18px}
.due{font-size:12px;font-weight:700;border-radius:999px;padding:0 8px;background:var(--surface2);color:var(--ink2);white-space:nowrap;line-height:1.9}
.due.soon{background:var(--warn-bg);color:var(--warn)}
.due.late{background:var(--warn);color:#fff}
.moremenu{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px 4px 12px}
.chipbtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.chipbtn.danger{color:var(--warn)}
.donelist{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:4px 0}
.donelist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 14px;font-size:15px}
.donelist .dot{width:22px;height:22px;border-radius:50%;background:var(--cd);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900;flex:none}
.donelist .nm{flex:1;min-width:0;color:var(--ink2);overflow-wrap:anywhere;text-decoration:line-through;text-decoration-color:var(--line)}
.donelist .undo{font-size:12px;color:var(--ink2)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--ink2);font-size:14px}
.addbtn{width:100%;border:2px dashed var(--line);background:none;border-radius:16px;padding:11px;font-weight:700;color:var(--ink2);margin-top:4px}
.gsub{font-size:13px;font-weight:700;color:var(--ink2);margin:10px 2px 2px}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:12px;border-radius:999px;background:var(--cb);color:var(--tagink);padding:0 10px;line-height:2;font-weight:700}

/* tests */
.tcard{width:100%;border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tcard .h{display:flex;align-items:center;gap:10px}
.tcard .h b{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.tcard .days{font-size:13px;font-weight:800;border-radius:999px;padding:1px 10px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.tcard .days.now{background:var(--warn-bg);color:var(--warn)}
.tcard .meta{font-size:13px;color:var(--ink2)}
.tcard.past{opacity:.6}
.sblock{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.sblock .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sblock .sh .d{font-size:13px;color:var(--ink2);margin-left:auto}
.range{font-size:14px;margin:8px 0 4px;padding:8px 12px;border-radius:12px;background:var(--surface2);white-space:pre-wrap;overflow-wrap:anywhere}
.plan{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;border-top:1px solid var(--line)}
.plan:first-of-type{border-top:0}
.plan .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.plan.done .nm{text-decoration:line-through;color:var(--ink2)}
.mc{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--cd);background:none;flex:none;padding:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.mc.on{background:var(--cd)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0}

/* record */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px;font-family:inherit}
.chart .val{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .barr{fill:var(--accent);opacity:.85}
.chart .barr.sel{opacity:1}
.chart .hit{fill:transparent;cursor:pointer}
.hbar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.hbar .track{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hbar .fill{height:100%;border-radius:999px;background:var(--cd)}
.hbar .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.daydetail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}

/* settings */
.srow{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);box-shadow:var(--shadow);border:0;border-radius:16px;padding:11px 14px;text-align:left}
.srow .txt{flex:1;min-width:0}
.srow .name{font-weight:700;overflow-wrap:anywhere}
.srow .memo{font-size:12px;color:var(--ink2)}
.sw{width:22px;height:22px;border-radius:50%;background:var(--cb);flex:none;box-shadow:inset 0 0 0 2px var(--cd)}
.hint{font-size:13px;color:var(--ink2);margin:6px 2px 10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lb{font-weight:700;font-size:14px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);box-shadow:none}
.pick.subj[aria-pressed="true"]{background:var(--cb);color:var(--tagink);box-shadow:inset 0 0 0 2px var(--cd)}
.pick.dw{width:42px;justify-content:center;padding:6px 0}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatch{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:var(--cb);box-shadow:inset 0 0 0 2px var(--cd)}
.swatch[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--cd),0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:14px}
.tg{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--surface2);flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.tg[aria-checked="true"]{background:var(--accent)}
.tg[aria-checked="true"]::after{left:23px}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);border-radius:16px;padding:10px 14px;font-size:13px;margin-top:12px}
.banner b{color:var(--warn)}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 16px;font-weight:700;text-decoration:none;color:var(--ink)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:2px;z-index:5}
.tabs button{flex:1;max-width:160px;border:0;background:none;border-radius:14px;padding:6px 2px;font-weight:700;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(40,30,55,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.setup{margin-top:28px}
.setup h1{font-size:28px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none}}
</style>
</head>

function taskRow(item, kind, date){
  const sid=item.subjectId;
  let attrs, chip="", menu="";
  if (kind==="r"){ attrs=`data-toggle="${item.id}" data-date="${date}"`; }
  else if (kind==="w"){ attrs=`data-toggleweek="${item.id}" data-wk="${item.ws}" data-date="${date}"`; chip=dueChip(item.dueDate,date,false); }
  else { attrs=`data-toggletask="${item.id}" data-date="${date}"`; chip=dueChip(item.due,date,false); }
  if (openMore===kind+item.id){
    menu = `<div class="moremenu">${kind==="r"?`<button class="chipbtn" data-skip="${item.id}">${t("skipToday")}</button>`
      : kind==="w"?`<button class="chipbtn" data-skipweek="${item.id}" data-wk="${item.ws}">${t("skipWeek")}</button>`
      : `<button class="chipbtn" data-edittask="${item.id}">${t("edit")}</button><button class="chipbtn danger" data-deltask="${item.id}">${confirmKey==="del"+item.id?t("reallyDel"):t("del")}</button>`}</div>`;
  }
  const testNm = kind==="k" && item.testId && testById(item.testId) ? `<span class="due">${esc(testById(item.testId).name)}</span>` : "";
  return `<div class="task" style="${cv(sid)}">
    <button class="main" ${attrs} aria-pressed="false"><span class="check"></span>
      <span class="txt"><span class="line1">${tag(sid)}${chip}${testNm}</span><span class="name">${esc(item.name)}</span>${item.memo?`<span class="memo">${esc(item.memo)}</span>`:""}</span></button>
    <button class="more" data-more="${kind+item.id}" aria-label="${t("more")}">⋯</button></div>${menu}`;
}
function doneBtn(attr, item){ return `<button ${attr} style="${cv(item.subjectId)}"><span class="dot">✓</span><span class="nm">${esc(item.name)}</span><span class="undo">${t("undo")}</span></button>`; }

function todayHTML(){
  const date=cur, today=todayISO(), isToday=date===today;
  const R=routinesFor(date), W=weeklyDue(date);
  const soonLimit = addDays(date,7);
  const pendTasks = data.tasks.filter(k=>!k.doneDate && (isToday ? k.due<=soonLimit : k.due===date)).sort(sortByDue);
  const laterCount = isToday ? data.tasks.filter(k=>!k.doneDate && k.due>soonLimit).length : 0;
  const doneTasks = data.tasks.filter(k=>k.doneDate===date);
  const doneWeek = W.all.filter(r=>r.doneDate===date);
  const total = R.active.length + W.pending.length + doneWeek.length + pendTasks.length + doneTasks.length;
  const n = R.done.length + doneWeek.length + doneTasks.length;
  const pct = total? Math.round(n/total*100):0;

  let h = `<header class="top">
    <div class="dayline">
      <button class="navbtn" data-day="-1" aria-label="${t("prevDay")}">‹</button>
      <div class="date"><div class="eyebrow">${isToday?t("eyeToday"):t("eyeDay")}${data.name?`${DOT()}${esc(data.name)}`:""}</div><h1>${dateTitle(date)}</h1>
        <div class="sub">${inPrep(date)?`<span class="due soon">${t("testPeriod")}</span>`:""}${isToday?"":`<button class="pill" data-gotoday>${t("goToday")}</button>`}</div></div>
      <button class="navbtn" data-day="1" aria-label="${t("nextDay")}">›</button>
    </div>
    ${heroHTML(date)}
    ${isToday?timerHTML():""}
    <div class="card prog"><div class="row"><div class="big num">${n}<small>${t("doneOf",{n:total})}</small></div><div class="rest num">${total?pct+"%":""}</div></div>
      <div class="bar"><span style="width:${pct}%;${GRAD}"></span></div></div>
    ${banners()}
  </header>`;

  h += `<h2 class="sec">${isToday?t("todoToday"):t("todoDay")}<span class="cnt num">${t("items",{n:R.todo.length+W.pending.length+pendTasks.length})}</span></h2>`;
  if (!R.todo.length && !W.pending.length && !pendTasks.length) h += `<div class="empty">${total?t("allDone"):t("noPlans")}</div>`;
  if (R.todo.length) h += `<div class="gsub">${t("gDaily")}</div><div class="list">${R.todo.map(r=>taskRow(r,"r",date)).join("")}</div>`;
  if (W.pending.length) h += `<div class="gsub">${t("gWeekly")}</div><div class="list">${W.pending.slice().sort((a,b)=>a.dueDate<b.dueDate?-1:1).map(r=>taskRow(r,"w",date)).join("")}</div>`;
  if (pendTasks.length) h += `<div class="gsub">${isToday?t("gSoon"):t("gThisDay")}</div><div class="list">${pendTasks.map(k=>taskRow(k,"k",date)).join("")}</div>`;
  if (laterCount) h += `<button class="addbtn" data-view="plan" style="border-style:solid">${t("moreTasks",{n:laterCount})}</button>`;
  h += `<button class="addbtn" data-newtask>${t("addTask")}</button>`;

  h += `<h2 class="sec">${t("doneList")}<span class="cnt num">${t("items",{n})}</span></h2>`;
  if (!n) h += `<div class="empty">${t("none")}</div>`;
  else h += `<div class="donelist">${
    R.done.map(r=>doneBtn(`data-toggle="${r.id}" data-date="${date}"`,r)).join("")
    + doneWeek.map(r=>doneBtn(`data-toggleweek="${r.id}" data-wk="${r.ws}" data-date="${date}"`,r)).join("")
    + doneTasks.map(k=>doneBtn(`data-toggletask="${k.id}" data-date="${date}"`,k)).join("")}</div>`;
  if (R.skipped.length || W.skipped.length) h += `<h2 class="sec">${t("skipped")}</h2><div class="pickrow">${R.skipped.map(r=>`<button class="chipbtn" data-unskip="${r.id}">${esc(r.name)} ↺</button>`).join("")}${W.skipped.map(r=>`<button class="chipbtn" data-unskipweek="${r.id}" data-wk="${r.ws}">${esc(r.name)}${t("thisWeekTag")} ↺</button>`).join("")}</div>`;
  return h;
}

function testCard(x, ref){
  const st=testState(x,ref);
  const tasks=data.tasks.filter(k=>k.testId===x.id), done=tasks.filter(k=>k.doneDate).length;

  const badge = st.kind==="before"?`<span class="days num">${t("badgeLeft",{n:st.days})}</span>`:st.kind==="now"?`<span class="days now">${t("badgeNow")}</span>`:`<span class="days">${t("badgeEnd")}</span>`;

function recordHTML(){
  const today=todayISO(), ws=weekStartOf(weekCur,data.weekStart), we=addDays(ws,6);
  const dates=[]; for(let i=0;i<7;i++) dates.push(addDays(ws,i));
  const perDay = dates.map(d=>{ const tt=getDay(d).time; return {d, total:Object.values(tt).reduce((a,b)=>a+b,0), t:tt}; });
  const weekTotal = perDay.reduce((a,p)=>a+p.total,0);
  const bySubj = {}; perDay.forEach(p=>Object.keys(p.t).forEach(k=>{ bySubj[k]=(bySubj[k]||0)+p.t[k]; }));
  const subjRows = Object.keys(bySubj).filter(k=>bySubj[k]>0).sort((a,b)=>bySubj[b]-bySubj[a]);
  const maxS = Math.max(1,...subjRows.map(k=>bySubj[k]));
  let rDone=0,rAll=0; dates.forEach(d=>{ if(d>today || d<data.startISO) return; const R=routinesFor(d); rAll+=R.active.length; rDone+=R.done.length; });
  const kDone = data.tasks.filter(k=>k.doneDate && k.doneDate>=ws && k.doneDate<=we).length;

  const W=340,H=170,padL=8,padR=8,top=22,bottom=26, cw=(W-padL-padR)/7, bw=Math.min(26,cw*.5);
  const maxM = Math.max(60, ...perDay.map(p=>p.total));
  const stepH = maxM<=120?30:maxM<=300?60:120, yMax=Math.ceil(maxM/stepH)*stepH;
  const y = m => top + (H-top-bottom)*(1-m/yMax);
  let grid=""; for(let m=stepH;m<=yMax;m+=stepH){ grid+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(m)}" y2="${y(m)}"/>`; }
  let bars="";
  perDay.forEach((p,i)=>{
    const cx=padL+cw*i+cw/2, yy=y(p.total);
    if (p.total>0){
      bars+=`<path class="barr${selDay===p.d?" sel":""}" d="M${cx-bw/2},${H-bottom} V${yy+4} Q${cx-bw/2},${yy} ${cx-bw/2+4},${yy} H${cx+bw/2-4} Q${cx+bw/2},${yy} ${cx+bw/2},${yy+4} V${H-bottom} Z"></path>`;
      bars+=`<text class="val" x="${cx}" y="${yy-6}" text-anchor="middle">${p.total>=60?(Math.round(p.total/6)/10)+"h":p.total+"m"}</text>`;
    }
    bars+=`<text x="${cx}" y="${H-8}" text-anchor="middle" ${p.d===today?'style="fill:var(--accent);font-weight:700"':""}>${DOWN()[dow(p.d)]}</text>`;
    bars+=`<rect class="hit" data-selday="${p.d}" x="${padL+cw*i}" y="${top}" width="${cw}" height="${H-top}"><title>${mdw(p.d)} ${fmtMin(p.total)}</title></rect>`;
  });
  const sel = perDay.find(p=>p.d===selDay);
  let h = `<header class="top"><div class="dayline">
      <button class="navbtn" data-rweek="-1" aria-label="${t("prevWeek")}">‹</button>
      <div class="date"><div class="eyebrow">${t("eyeRec")}</div><h1 class="num">${md(ws)}${TIL()}${md(we)}</h1>
        <div class="sub">${(today>=ws&&today<=we)?t("thisWeek"):`<button class="pill" data-rweek="0">${t("goThisWeek")}</button>`}</div></div>
      <button class="navbtn" data-rweek="1" aria-label="${t("nextWeek")}">›</button></div></header>
    <div class="card"><div class="eyebrow">${t("weekTime")}</div><div style="font-size:30px;font-weight:800" class="num">${fmtMin(weekTotal)}</div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chartLabel")}">${grid}<line class="grid" x1="${padL}" x2="${W-padR}" y1="${H-bottom}" y2="${H-bottom}"/>${bars}</svg>
      <div class="daydetail">${sel ? `<b>${mdw(sel.d)}</b> ${fmtMin(sel.total)}<div class="minis" style="margin-top:6px">${Object.keys(sel.t).filter(k=>sel.t[k]>0).map(k=>`<span class="mini" style="${cv(k)}">${esc(subj(k).name)} ${fmtMin(sel.t[k])}</span>`).join("")||`<span style="color:var(--ink2)">${t("noRec")}</span>`}</div>` : `<span style="color:var(--ink2)">${t("tapBar")}</span>`}</div>
    </div>`;
  h += `<h2 class="sec">${t("bySubj")}</h2><div class="card">${subjRows.length?subjRows.map(k=>`<div class="hbar" style="${cv(k)}"><span>${tag(k)}</span><span class="track"><span class="fill" style="display:block;width:${bySubj[k]/maxS*100}%"></span></span><span class="v">${fmtMin(bySubj[k])}</span></div>`).join(""):`<div style="color:var(--ink2);font-size:14px">${t("noWeekRec")}</div>`}</div>`;
  h += `<h2 class="sec">${t("achieve")}</h2><div class="card"><div class="hbar" style="--cd:var(--accent)"><span>${t("dailyTasks")}</span><span class="track"><span class="fill" style="display:block;width:${rAll?rDone/rAll*100:0}%"></span></span><span class="v">${rDone}/${rAll}</span></div>
     <div style="font-size:14px;margin-top:6px">${t("datedDone",{n:kDone})}</div></div>`;
  return h;
}

let tickId=null;
function tickTimer(){
  clearInterval(tickId);
  if (!data || !data.timer) return;
  const f=()=>{ const el=document.getElementById("timerTxt"); if(!el) return; const s=Math.max(0,Math.floor((Date.now()-data.timer.start)/1000)); const hh=Math.floor(s/3600), mm=Math.floor(s%3600/60), ss=s%60; el.textContent = hh?`${hh}:${pad(mm)}:${pad(ss)}`:`${mm}:${pad(ss)}`; };
  f(); tickId=setInterval(f,1000);
}
function stopTimer(){
  const tm=data.timer; if(!tm) return;

  const day=iso(new Date(tm.start)); const r=dayRef(day); r.time[tm.sid]=(r.time[tm.sid]||0)+min;

}

function readEd(){

  if (g("e-end")) ed.end=g("e-end").value;

modal.addEventListener("input", e=>{

modal.addEventListener("click", e=>{
  if(!ed) return;

  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  if (d.psubj){ readEd(); ed.subjectId=d.psubj; renderEd(); }
  else if (d.color){ readEd(); ed.color=d.color; renderEd(); }
  else if (d.emode){ readEd(); ed.mode=d.emode; renderEd(); }
  else if (d.due!==undefined){ readEd(); ed.due=+d.due; renderEd(); }
  else if (d.dw!==undefined){ readEd(); const i=+d.dw; ed.days=ed.days.includes(i)?ed.days.filter(x=>x!==i):[...ed.days,i]; renderEd(); }
  else if (d.pause!==undefined){ readEd(); ed.pauseInTest=!ed.pauseInTest; renderEd(); }
  else if (d.addmin){ readEd(); ed.min=(ed.min||0)+(+d.addmin); renderEd(); }
  else if (d.eddel!==undefined){
    if(!ed.confirmDel){ readEd(); ed.confirmDel=true; renderEd(); return; }
    if (ed.kind==="subject"){ data.subjects=data.subjects.filter(s=>s.id!==ed.id); }
    else if (ed.kind==="routine"){ data.routines=data.routines.filter(r=>r.id!==ed.id); }
    else if (ed.kind==="task"){ data.tasks=data.tasks.filter(k=>k.id!==ed.id); }
    else if (ed.kind==="test"){ data.tests=data.tests.filter(x=>x.id!==ed.id); data.tasks=data.tasks.filter(k=>k.testId!==ed.id); if(testId===ed.id){ testId=null; view="plan"; } }
    closeEd(); commit(); toast(t("deleted"));
  }
});
modal.addEventListener("submit", e=>{
  e.preventDefault(); readEd();
  const name=(ed.name||"").trim();
  if (ed.kind==="timerstart"){ if(!ed.subjectId) return toast(t("pickSubj")); data.timer={sid:ed.subjectId,start:Date.now()}; closeEd(); commit(); return; }
  if (ed.kind==="time"){
    if(!ed.subjectId) return toast(t("pickSubj")); if(!(ed.min>0)) return toast(t("enterTime")); if(!ed.day) return toast(t("enterDate"));
    const m=ed.min, r=dayRef(ed.day); r.time[ed.subjectId]=(r.time[ed.subjectId]||0)+m; closeEd(); commit(); toast(t("addedTime",{m:fmtMin(m)})); return;
  }
  if (!name) return toast(t("enterName"));
  if (ed.kind==="subject"){
    if (ed.id){ const s=data.subjects.find(x=>x.id===ed.id); s.name=name; s.color=ed.color; }
    else data.subjects.push({id:uid("s"),name,color:ed.color});
  } else if (ed.kind==="routine"){
    if(!ed.subjectId) return toast(t("pickSubj"));
    if (ed.mode==="due" ? !(ed.due>=0) : !ed.days.length) return toast(ed.mode==="due"?t("pickDue"):t("pickDaysMsg"));
    const item={id:ed.id||uid("r"),subjectId:ed.subjectId,name,memo:(ed.memo||"").trim(),mode:ed.mode==="due"?"due":"days",days:ed.mode==="due"?[]:ed.days.slice().sort((a,b)=>a-b),pauseInTest:!!ed.pauseInTest};
    if (item.mode==="due") item.due=ed.due;
    const i=data.routines.findIndex(x=>x.id===item.id); if(i>=0) data.routines[i]=item; else data.routines.push(item);
  } else if (ed.kind==="task"){
    if(!ed.subjectId) return toast(t("pickSubj")); if(!ed.due) return toast(t("enterDue"));
    const old=data.tasks.find(x=>x.id===ed.id);
    const item={id:ed.id||uid("k"),subjectId:ed.subjectId,name,memo:(ed.memo||"").trim(),due:ed.due,testId:ed.testId||"",doneDate:old?old.doneDate:""};
    const i=data.tasks.findIndex(x=>x.id===item.id); if(i>=0) data.tasks[i]=item; else data.tasks.push(item);
  } else if (ed.kind==="test"){
    if(!ed.start) return toast(t("enterFirst"));
    const end = ed.end && ed.end>=ed.start ? ed.end : ed.start;
    const ranges={}; Object.keys(ed.ranges).forEach(k=>{ const r=ed.ranges[k]; if((r.text||"").trim()||r.date) ranges[k]={date:r.date||"",text:(r.text||"").trim()}; });
    const item={id:ed.id||uid("x"),name,start:ed.start,end,ranges};
    const i=data.tests.findIndex(x=>x.id===item.id); if(i>=0) data.tests[i]=item; else data.tests.push(item);
    if(!ed.id){ testId=item.id; view="test"; }
  }
  closeEd(); commit(); toast(t("saved"));
});

/* ---------- main events ---------- */
function onClick(e){
  const b=e.target.closest("button,[data-selday]"); if(!b) return;
  const d=b.dataset;
  if (d.reset===undefined && !(d.deltask) && confirmKey) confirmKey=null;
  if (d.lang){ setLang(d.lang); if(data){ data.lang=d.lang; persist(); } render(); return; }
  if (d.selday){ selDay = selDay===d.selday?null:d.selday; render(); return; }
  if (d.view){ view=d.view; openMore=null; try{localStorage.setItem(KEY+"-view",view);}catch(_){}; render(); window.scrollTo(0,0); return; }
  if (d.opentest){ testId=d.opentest; view="test"; render(); window.scrollTo(0,0); return; }
  if (d.toggle){ const r=dayRef(d.date||cur); r.done[d.toggle]=!r.done[d.toggle]; commit(); return; }
  if (d.toggleweek){ const w=weekRef(d.wk); if(w.done[d.toggleweek]) delete w.done[d.toggleweek]; else w.done[d.toggleweek]=d.date||todayISO(); commit(); return; }
  if (d.toggletask){ const k=data.tasks.find(x=>x.id===d.toggletask); if(k){ k.doneDate = k.doneDate?"":(d.date && d.date<=todayISO()?d.date:todayISO()); commit(); } return; }
  if (d.more){ openMore = openMore===d.more?null:d.more; confirmKey=null; render(); return; }
  if (d.skip){ openMore=null; const r=dayRef(cur); if(!r.skip.includes(d.skip)) r.skip.push(d.skip); commit(); toast(t("skippedToday")); return; }
  if (d.unskip){ const r=dayRef(cur); r.skip=r.skip.filter(x=>x!==d.unskip); commit(); return; }
  if (d.skipweek){ openMore=null; const w=weekRef(d.wk); if(!w.skip.includes(d.skipweek)) w.skip.push(d.skipweek); commit(); toast(t("skippedWeek")); return; }
  if (d.unskipweek){ const w=weekRef(d.wk); w.skip=w.skip.filter(x=>x!==d.unskipweek); commit(); return; }
  if (d.deltask){ if(confirmKey!=="del"+d.deltask){ confirmKey="del"+d.deltask; render(); return; } data.tasks=data.tasks.filter(k=>k.id!==d.deltask); confirmKey=null; openMore=null; commit(); toast(t("deleted")); return; }
  if (d.edittask){ const k=data.tasks.find(x=>x.id===d.edittask); openMore=null; if(k) openEd(Object.assign({kind:"task"},clone(k))); return; }
  if (d.day){ cur=addDays(cur,+d.day); openMore=null; render(); return; }
  if (d.gotoday!==undefined){ cur=todayISO(); render(); return; }
  if (d.rweek!==undefined){ weekCur = +d.rweek===0?todayISO():addDays(weekCur,7*(+d.rweek)); selDay=null; render(); return; }
  if (d.newtask!==undefined){ openEd({kind:"task",subjectId:"",name:"",memo:"",due:addDays(todayISO(),3),testId:""}); return; }
  if (d.newplan!==undefined){ const x=testById(testId); const r=x&&x.ranges[d.newplan]; const dd = r&&r.date? addDays(r.date,-1) : (x?addDays(x.start,-1):addDays(todayISO(),3)); openEd({kind:"task",subjectId:d.newplan,name:"",memo:"",due:dd<todayISO()?todayISO():dd,testId:testId||""}); return; }
  if (d.newtest!==undefined){ openEd({kind:"test",name:"",start:addDays(todayISO(),14),end:addDays(todayISO(),17),ranges:{}}); return; }
  if (d.edittest){ const x=testById(d.edittest); if(x) openEd(Object.assign({kind:"test"},clone(x))); return; }
  if (d.newsubj!==undefined){ const used=new Set(data.subjects.map(s=>s.color)); const c=(PAL.find(p=>!used.has(p.id))||PAL[0]).id; openEd({kind:"subject",name:"",color:c}); return; }
  if (d.editsubj){ const s=data.subjects.find(x=>x.id===d.editsubj); if(s) openEd(Object.assign({kind:"subject"},clone(s))); return; }
  if (d.newroutine!==undefined){ openEd({kind:"routine",subjectId:"",name:"",memo:"",mode:"days",days:[],due:null,pauseInTest:false}); return; }
  if (d.editroutine){ const r=data.routines.find(x=>x.id===d.editroutine); if(r) openEd(Object.assign({kind:"routine",memo:""},clone(r))); return; }
  if (d.timerstartsheet!==undefined){ openEd({kind:"timerstart",subjectId:""}); return; }
  if (d.timerstop!==undefined){ stopTimer(); return; }
  if (d.timercancel!==undefined){ data.timer=null; commit(); toast(t("canceled")); return; }
  if (d.addtime!==undefined){ openEd({kind:"time",subjectId:"",min:0,day:todayISO()}); return; }
  if (d.wstart){ data.weekStart=+d.wstart; commit(); return; }
  if (d.seed){ data = d.seed==="sample"?sampleData():blankData(); if(d.seed==="blank") view="settings"; commit(); return; }
  if (d.export!==undefined){ exportData(); return; }
  if (d.import!==undefined){ document.getElementById("importFile").click(); return; }
  if (d.reset!==undefined){ if(confirmKey!=="reset"){ confirmKey="reset"; render(); return; } confirmKey=null; data=null; try{localStorage.removeItem(KEY);}catch(_){}; render(); return; }
}

/* ---------- backup ---------- */
async function exportData(){
  const name=t("backupName",{d:todayISO()});
  const json=JSON.stringify(Object.assign({app:"study-planner",version:1,savedAt:new Date().toISOString()},data,{lastBackupISO:todayISO()}),null,1);
  const blob=new Blob([json],{type:"application/json"});
  const done=()=>{ data.lastBackupISO=todayISO(); commit(); toast(t("backupSaved")); };
  try{ const file=new File([blob],name,{type:"application/json"}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:t("backupTitle")}); return done(); } }
  catch(err){ if(err && err.name==="AbortError"){ toast(t("backupCancel")); return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); done();
}
document.getElementById("importFile").addEventListener("change", e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j||!Array.isArray(j.subjects)) throw 0; delete j.app; delete j.version; delete j.savedAt; data=normalize(j); if(data.lang && STR[data.lang]) setLang(data.lang); commit(); toast(t("restored")); }catch(err){ toast(t("badFile")); } e.target.value=""; };
  r.readAsText(f);
});

let toastT;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2400); }

let lastToday=todayISO();
function dayCheck(){ const x=todayISO(); if(x!==lastToday){ if(cur===lastToday) cur=x; lastToday=x; if(!ed) render(); } }
setInterval(dayCheck,60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ dayCheck(); if(!ed && data) render(); } });

/* ---------- boot ---------- */
data=load();
if (data && data.lang && STR[data.lang]) setLang(data.lang);
try{ const v=localStorage.getItem(KEY+"-view"); if(["today","plan","record","settings"].includes(v)) view=v; }catch(e){}
render();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if (onWeb && "serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
})();
</script>
